<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080b18"><title>AVE RUSH — Neon Runner</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b18;color:#f4f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}button{font:inherit;color:inherit;cursor:pointer;border:1px solid #ffffff2b;background:#ffffff0d;backdrop-filter:blur(12px);border-radius:14px;padding:12px 18px;touch-action:manipulation}.hud{position:absolute;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:clamp(14px,3vw,30px);gap:12px}.brand{font-weight:1000;letter-spacing:.14em;font-size:clamp(20px,3vw,30px);text-shadow:0 0 22px #63f5ff88}.brand span{color:#63f5ff}.tag{font-size:10px;letter-spacing:.25em;color:#9aa8c8;margin-top:4px}.stats{display:flex;gap:8px}.pill{background:#10172bd9;border:1px solid #ffffff20;border-radius:13px;padding:8px 12px;min-width:66px;text-align:center}.pill small{display:block;color:#91a0c4;font-size:9px;letter-spacing:.15em}.pill b{font-size:20px}.center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:auto;padding:20px}.panel{width:min(480px,94vw);text-align:center;padding:clamp(24px,5vw,42px);border:1px solid #b5faff36;border-radius:28px;background:linear-gradient(145deg,#121b31ef,#090d1cf5);box-shadow:0 0 70px #00d9ff18,0 30px 100px #0009;backdrop-filter:blur(20px)}.eyebrow{font-size:10px;letter-spacing:.35em;color:#63f5ff;font-weight:800}.panel h1{font-size:clamp(42px,10vw,74px);line-height:.95;letter-spacing:-.07em;margin:16px 0 12px;font-weight:1000}.panel h1 em{font-style:normal;color:transparent;-webkit-text-stroke:1.5px #63f5ff;filter:drop-shadow(0 0 12px #63f5ff66)}.panel p{color:#aebbd8;line-height:1.65;font-size:14px;max-width:330px;margin:0 auto 24px}.primary{background:linear-gradient(100deg,#62f5ff,#a5ffdb);color:#07111b;font-weight:900;border:0;box-shadow:0 0 30px #63f5ff40;min-width:170px}.help{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px;co </style></head><body><canvas id="game"></canvas><div class="hud"><div class="top"><div><div class="brand">AVE<span>RUSH</span></div><div class="tag">NEON RUNNER // 01</div></div><div class="stats"><div class="pill"><small>DISTANCE</small><b id="distance">0</b></div><div class="pill"><small>SHARDS</small><b id="coins">0</b></div><div class="pill"><small>BEST</small><b id="best">0</b></div></div></div><div id="overlay" class="center"><div class="panel"><div class="eyebrow">/// THE CITY NEVER SLEEPS</div><h1>AVE <em>RUSH</em></h1><p>A high-speed run through a neon megacity. Dodge the barriers, collect energy shards, and see how far you can go.</p><button id="start" class="primary">▶ &nbsp; START RUN</button><div class="help"><span class="key">←</span><span class="key">→</span><span>move</span><span class="key">SPACE</span><span>jump</span></div></div></div><div class="bottom"><div class="controls"><button class="control" id="left">←</button><button class="control" id="jump">↑</button><button class="control" id="right">→</button></div><div class="note">AVOID THE GLOWING BLOCKS<br>COLLECT THE CYAN SHARDS</div></div></div>
<script>(()=>{'use strict';const c=document.querySelector('canvas'),x=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,D=1;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();let state='menu',lane=0,jy=0,jv=0,score=0,coins=0,speed=.43,spawn=.5,obs=[],bits=[],last=0,time=0,best=+(localStorage.aveRushBest||0);$('best').textContent=best;const rnd=(a,b)=>a+Math.random()*(b-a);function start(){state='run';lane=jy=jv=score=coins=time=0;speed=.43;spawn=.4;obs=[];bits=[];$('distance').textContent=$('coins').textContent='0';$('overlay').classList.add('hidden')}function finish(){state='over';best=Math.max(best,score|0);localStorage.aveRushBest=best;$('best').textContent=best;$('overlay').innerHTML='<div class="panel"><div class="eyebrow">/// RUN COMPLETE</div><h1>WIPE<em>OUT</em></h1><p>You travelled <b>'+Math.floor(score)+' m</b> and collected <b>'+coins+'</b> energy shards. Ready for another run?</p><button id="again" class="primary">↻ &nbsp; RUN AGAIN</button><div class="help">BEST DISTANCE &nbsp; <b>'+best+' m</b></div></div>';$('overlay').classList.remove('hidden');$('again').onclick=start}function move(d){if(state==='run')lane=Math.max(-1,Math.min(1,lane+d))}function jump(){if(state==='run'&&jy<=0)jv=H*.9} $('start').onclick=start;$('left').onpointerdown=e=>{e.preventDefault();move(-1)};$('right').onpointerdown=e=>{e.preventDefault();move(1)};$('jump').onpointerdown=e=>{e.preventDefault();jump()};addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','ArrowUp','a','d','A','D'].includes(e.key))e.preventDefault();if(state!=='run'&&(e.key==='Enter'||e.key===' ')){start();return}if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')move(-1);if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')move(1);if(e.key===' '||e.key==='ArrowUp'||e.key==='w')jump()});let sx=0,sy=0;c.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};c.ontouchend=e=>{if(state!=='run')return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>24)move(dx>0?1:-1);else if(dy<-20)jump()};function poly(a,fill,stroke,lw=1){x.beginPath();a.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.closePath();x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=lw;x.stroke()}}function ln(a,b,d,e,col,w=1){x.beginPath();x.moveTo(a,b);x.lineTo(d,e);x.strokeStyle=col;x.lineWidth=w;x.stroke()}function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#070b1d');g.addColorStop(.52,'#17143a');g.addColorStop(1,'#311b52');x.fillStyle=g;x.fillRect(0,0,W,H);for(let layer=0;layer<2;layer++){let unit=layer?42:65,base=H*(.58+layer*.07);for(let a=-unit;a<W+unit;a+=unit){let n=Math.abs(Math.sin(a*12.989+layer*71))*1000,h=(.07+(n%100)/100*.22)*H*(layer?1:.8);x.fillStyle=layer?'#101936':'#0a1027';x.fillRect(a,base-h,unit-3,h);for(let yy=base-h+10;yy<base-5;yy+=12)for(let xx=a+6;xx<a+unit-7;xx+=10){x.fillStyle=Math.sin(xx*yy)%2>0?'#38d9ff44':'#ff4fd822';x.fillRect(xx,yy,3,5)}}}let gl=x.createRadialGradient(W/2,H*.62,2,W/2,H*.62,W*.48);gl.addColorStop(0,'#ff3bc42a');gl.addColorStop(1,'#ff3bc400');x.fillStyle=gl;x.fillRect(0,0,W,H)}function road(t){let hy=H*.38,bo=H*1.13,cx=W/2,ht=W*.045,hb=W*.57;poly([[cx-ht,hy],[cx+ht,hy],[cx+hb,bo],[cx-hb,bo]],'#10172d','#294b70',1.5);poly([[cx-ht,hy],[cx-ht*.6,hy],[cx-hb*.84,bo],[cx-hb,bo]],'#17223c');poly([[cx+ht*.6,hy],[cx+ht,hy],[cx+hb,bo],[cx+hb*.84,bo]],'#17223c');for(let i=0;i<2;i++)ln(cx+(i?1:-1)*ht*.34,hy,cx+(i?1:-1)*hb*.34,bo,'#52eaff55');for(let i=0;i<18;i++){let z=(i/18+(t*.00032)%1)%1,p=z*z,y=hy+p*(bo-hy),h=ht+p*(hb-ht);ln(cx-h,y,cx+h,y,'#314b6b',.5+p)}for(let s of [-1/3,1/3])for(let i=0;i<12;i++){let z=(i/12+(t*.00065)%1)%1,p=z*z,y=hy+p*(bo-hy),xx=cx+s*(ht+p*(hb-ht));ln(xx,y,xx,y+2+p*30,'#8b77ff88',1+p*2)}}function proj(l,z){let p=z*z;return{x:W/2+l*W*(.045+p*.57)*.67,y:H*.38+p*(H*.11+H*.64),s:.15+p*1.45}}function spawnObj(){obs.push({type:Math.random()<.69?'block':'shard',lane:Math.floor(rnd(-1.5,1.5)),z:0})}function drawBike(a,b,s){x.save();x.translate(a,b);x.scale(s,s);x.shadowBlur=22;x.shadowColor='#62f5ff';x.fillStyle='#0009';x.beginPath();x.ellipse(0,4,25,8,0,0,7);x.fill();x.shadowBlur=0;poly([[-18,-12],[-12,-35],[-5,-47],[6,-45],[17,-22],[13,-9],[0,-3]],'#151c35','#6cf6ff',2);poly([[-10,-30],[-4,-42],[4,-40],[10,-24],[0,-17]],'#7ef9ff');poly([[-15,-18],[-26,-5],[-10,-2],[-4,-13]],'#ff4fd8','#ff8ae9');poly([[12,-20],[26,-7],[10,-2],[4,-13]],'#ff4fd8','#ff8ae9');poly([[-9,-6],[-14,6],[-7,13],[0,7],[7,13],[14,6],[9,-6]],'#080d1c','#7cf8ff',2);x.fillStyle='#b9ffff';x.fillRect(-4,-31,8,3);x.restore()}function particle(a,b,col){for(let i=0;i<10;i++)bits.push({x:a,y:b,vx:rnd(-130,130),vy:rnd(-180,70),life:rnd(.25,.6),max:.6,col})}function drawObj(o){let p=proj(o.lane,o.z),s=p.s;x.save();x.translate(p.x,p.y);if(o.type==='block'){let w=34*s,h=45*s;x.shadowBlur=18*s;x.shadowColor='#ff4fd8';poly([[-w/2,-h],[w/2,-h],[w/2,0],[-w/2,0]],'#3c1748','#ff55dd',2*s);poly([[-w/2,-h],[-w/2+7*s,-h-9*s],[w/2+7*s,-h-9*s],[w/2,-h]],'#8b2a8c','#ff86e8',s);poly([[w/2,-h],[w/2+7*s,-h-9*s],[w/2+7*s,-9*s],[w/2,0]],'#271b4e','#d953ff',s)}else{x.translate(0,-25*s);x.rotate(time*.003);let r=8*s;x.shadowBlur=22*s;x.shadowColor='#62f5ff';poly([[0,-r*1.5],[r,0],[0,r*1.5],[-r,0]],'#b9ffff','#62f5ff',2*s);poly([[0,-r],[r*.45,0],[0,r],[0,0]],'#32b9ee')}x.restore()}function frame(now){let dt=Math.min((now-last)/1000||0,.04);last=now;time=now;bg();road(now);if(state==='run'){score+=dt*(18+speed*12);speed=Math.min(.82,speed+dt*.002);spawn-=dt;if(spawn<=0){spawn=rnd(.48,.86)*(1-speed*.4);spawnObj()}if(jv){jv-=H*2.6*dt;jy+=jv*dt;if(jy<=0)jy=jv=0}for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.z+=dt*speed;if(o.z>1.05){obs.splice(i,1);continue}let p=proj(o.lane,o.z);if(o.z>.87&&o.z<.99&&o.lane===lane){if(o.type==='shard'){coins++;particle(p.x,p.y-20,'#62f5ff');obs.splice(i,1);$('coins').textContent=coins}else if(jy<H*.2){particle(p.x,p.y,'#ff4fd8');finish();break}}}$('distance').textContent=Math.floor(score)}obs.slice().sort((a,b)=>a.z-b.z).forEach(drawObj);if(state==='run'||state==='over'){let p=proj(lane,.91);drawBike(p.x,p.y-Math.min(jy,H*.35),Math.min(W,H)/650)}for(let i=bits.length-1;i>=0;i--){let b=bits[i];b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=250*dt;if(b.life<=0){bits.splice(i,1);continue}x.globalAlpha=Math.max(0,b.life/b.max);x.fillStyle=b.col;x.shadowBlur=10;x.shadowColor=b.col;x.fillRect(b.x,b.y,4,4)}x.globalAlpha=1;x.shadowBlur=0;requestAnimationFrame(frame)}requestAnimationFrame(frame)})();</script></body></html>
